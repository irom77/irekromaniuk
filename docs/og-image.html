<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; }

  h1 em { color: #22564c; }
  .foot { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #d7ddd5; padding-top: 26px; font-size: 24px; color: #53666a; }

</style></head><body>
  <div class="top">Cybersecurity · Automation · Applied AI</div>
  <div class="main">
    <div class="mark">IREK ROMANIUK<span>.</span></div>

  </div>
