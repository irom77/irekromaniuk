name: Update YouTube channels

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-youtube
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Refresh the channel list in index.html
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 -I scripts/update_youtube.py
      - name: Commit and deploy if the list changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet index.html; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update YouTube channel list" index.html
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy-pages.yml --ref main
